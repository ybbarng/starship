pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,mjs,ts,tsx,json,css}"
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    - name: secrets
      run: gitleaks git --staged --no-banner --redact
    - name: denylist
      run: scripts/check-denylist.sh staged

commit-msg:
  jobs:
    - name: denylist
      run: scripts/check-denylist.sh message {1}

pre-push:
  jobs:
    - name: lint
      run: pnpm lint
    - name: typecheck
      run: pnpm typecheck
    - name: test
      run: pnpm test
